name: Refresh events

# Runs the full data pipeline (fetch → clean → enrich → geocode)
# and commits any updated artefacts back to the repo. GitHub Pages then
# serves the fresh CSVs/TopoJSON to the public site.
#
# Trigger:
#   - On a schedule: every two days at 09:00 UTC (≈ 4-5 AM US Eastern)
#   - On manual dispatch from the Actions tab
#
# Runtime budget: roughly 15–25 minutes per run. Nominatim rate-limits us
# to ~1 req/sec, so the geocoder is the slow step. Re-running cheaply hits
# the cached coords in geocode_cache.json — only new or changed addresses
# cost a fresh API round-trip.

on:
  schedule:
    - cron: "0 9 */2 * *"      # every two days at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write              # needed for the auto-commit step below
  issues: write                # needed to open/close the health-alert issue

jobs:
  refresh:
    runs-on: ubuntu-latest
    # At REQUEST_DELAY=15s, a cold or many-retry run can take 2+ hours.
    # Cache-warm refreshes are still under 10 min.
    timeout-minutes: 180

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # We need real history so `git push` works on the auto-commit step
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          # Nominatim requires a real contact in every request's User-Agent.
          # Add this as a repository secret at
          #   Settings → Secrets and variables → Actions → New repository secret
          NOMINATIM_CONTACT_EMAIL: ${{ secrets.NOMINATIM_CONTACT_EMAIL }}
        run: python refresh.py

      - name: Pipeline health check
        # Flags silent breakage (a kingdom feed producing 0 events, a sharp
        # drop vs the last run, a geocode-failure spike) as ::error::/::warning::
        # annotations visible in the run summary. Non-blocking (exits 0), so the
        # data commit below still happens; add --strict to fail the job instead.
        env:
          PYTHONIOENCODING: utf-8
        run: python health_check.py

      - name: Commit data updates if anything changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit the files the public site serves, plus the geocode cache
          # so the next scheduled run reuses prior lookups (and never repeats
          # the same Nominatim query, per their bulk-geocoding policy).
          git add sca_events_clean.csv geocode_cache.json description_cache.json eventprime_cache.json calon_desc_cache.json health_state.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          # Brief commit message naming the changed files
          git commit -m "Auto-refresh: $(git diff --cached --name-only | xargs)" \
            -m "Triggered by ${{ github.event_name }} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Another commit (a manual run, or a developer push) may have landed
          # while this job was running. Our commit only touches generated data
          # files, so rebasing onto it is conflict-free; retry a few times
          # rather than failing the whole run on a lost push race.
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing on origin/main and retrying"
            git pull --rebase --autostash origin main
          done
          if [ "$pushed" = false ]; then
            echo "::error::could not push data update after 3 attempts"
            exit 1
          fi

      - name: Open/update health-alert issue
        # health_check.py drops health_alert.md when a kingdom feed produced 0
        # events. Surface that as a single GitHub issue the maintainer is
        # notified about (it transfers with repo ownership), and auto-close it
        # when the feeds recover. Runs even if an earlier step failed.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh label create pipeline-health --color B60205 \
            --description "Automated: a kingdom feed produced 0 events" 2>/dev/null || true
          existing=$(gh issue list --label pipeline-health --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)
          stamp="run ${{ github.run_id }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -f health_alert.md ]; then
            body="$(cat health_alert.md)"$'\n\n'"_Detected on ${stamp}._"
            if [ -n "$existing" ]; then
              echo "Health alert active — commenting on issue #$existing"
              gh issue comment "$existing" --body "$body" || true
            else
              echo "Health alert active — opening a new issue"
              gh issue create --label pipeline-health \
                --title "⚠️ A kingdom feed is broken (0 events)" --body "$body" || true
            fi
          elif [ -n "$existing" ]; then
            echo "Feeds healthy again — closing issue #$existing"
            gh issue comment "$existing" \
              --body "✅ All configured feeds healthy again as of ${stamp}. Closing automatically." || true
            gh issue close "$existing" || true
          else
            echo "Feeds healthy, no open alert issue. Nothing to do."
          fi
